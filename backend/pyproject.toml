[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ashu-backend"
version = "0.1.0"
description = "FastAPI backend for Ashu academic assignment automation"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "clerk-backend-api>=5.0",
  "google-genai>=1.0",
  "groq>=0.11",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pypdf>=5.0",
  "python-pptx>=1.0",
  "cryptography>=43.0",
  "asyncpg>=0.29",
  "tenacity>=9.0",
  "orjson>=3.10",
  "email-validator>=2.2",
  "svix>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
